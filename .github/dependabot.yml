# 의존성 자동 감시.
#
# 이 파일이 없던 동안에는 GitHub 의 자동 "보안 업데이트"만 돌고 정기 "버전
# 업데이트"는 돌지 않았다. 그래서 취약점이 뜬 패키지는 따라갔지만, 취약점이
# 없는 패키지와 워크플로 액션 버전은 아무도 올리지 않아 드리프트가 쌓였다.
#
# ⚠️ 주기는 보안이 아니라 **주의력** 예산이다. `schedule.interval` 과 `cooldown`
# 은 version update 에만 적용되고 **security update 에는 적용되지 않는다** —
# 취약점 alert 이 뜨면 주기와 무관하게 보안 PR 이 즉시 올라온다.
# `open-pull-requests-limit` 역시 보안 PR 에는 적용되지 않고 카운트에도 안 든다.
# 그러므로 주기를 늘려도 보안 구멍은 생기지 않는다.
#
# 처음부터 weekly 가 아니라 monthly 로 시작하는 이유: 같은 소유자의 다른 레포가
# weekly 로 시작했다가 "25 개 패키지를 올렸는데 audit 감소 0 건"을 실측하고
# monthly 로 후퇴한 이력이 있다. 버전 범프의 보안 수익은 대체로 0 인 반면,
# `open-pull-requests-limit` 아래에서 제때 머지 못 한 PR 이 쌓이면 큐가 막힌다.
# 더 자주 = 배치가 작아 bisect 가 쉽다는 이점은 실재하므로, 매주 처리할 여력이
# 생기면 `interval` 한 줄만 weekly 로 바꾸면 된다.
#
# ⚠️ cooldown = "갓 나온 릴리스의 베타테스터가 되지 않기" 장치. 릴리스 후 N 일이
# 지나야 PR 대상이 된다(GitHub 기본 3 일). 아래 값은 그 기본보다 보수적이다.
#
# ⚠️ **런타임 의존성 PR 은 CI 가 빨갛게 나온다 — 정상이다.**
# `npm run check` 에 `third-party-notices:check` 가 들어 있고, 이 생성기는
# lockfile 에서 **런타임 의존성만** 훑어 `public/THIRD-PARTY-NOTICES.txt` 에
# 버전 문자열까지 박는다. Dependabot 은 package.json / package-lock.json 만
# 고치고 이 산출물은 재생성하지 않으므로, 런타임 패키지가 섞인 PR 은 notices 가
# stale 이 되어 실패한다. 처리법은 그 브랜치에서 아래를 돌리고 커밋 한 번 얹는 것:
#
#     npm run third-party-notices:generate
#
# dev 전용 패키지만 오른 PR 은 notices 가 바뀌지 않으므로 그냥 초록이다.
# 이 때문에 런타임 의존성을 `ignore` 하고 싶어질 수 있는데, 그러면 안 된다 —
# 아래 항목을 볼 것.
#
# ⚠️ `ignore` 는 버전 업데이트뿐 아니라 **security-update PR 도 함께 억제**한다.
# 그래서 여기서는 major 만 ignore 한다. 런타임 패키지를 ignore 하면 취약점이
# 터져도 보안 PR 이 안 오는데, 이 레포는 공개 배포물이라 그 대가가 너무 크다.
#
# ⚠️ 다른 레포의 dependabot.yml 을 참고할 때 expo / react-native / react 계열
# ignore 를 그대로 옮기지 말 것. 그 항목들은 Expo SDK 호환 매트릭스와 root
# overrides 고정이 있는 React Native 레포의 사정이다. 여기는 Vite 웹앱이라
# 해당 제약이 없고, 근거 없는 ignore 는 보안 PR 만 막는 죽은 줄이 된다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      # major 는 아래 ignore 로 애초에 안 오므로 semver-major-days 는 두지 않는다.
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
    open-pull-requests-limit: 3
    # package.json 이 핵심 의존성을 정확한 버전으로 고정해 두었으므로,
    # 범위를 넓히지 않고 필요할 때만 고정 값을 올린다.
    versioning-strategy: increase-if-necessary
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      monthly-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # major 는 사람이(또는 지시받은 세션이) 맥락을 보고 결정
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 워크플로 액션은 보안 업데이트로 잡히지 않아 이 항목 없이는 영원히 드리프트한다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # 1 이 아니라 2 인 이유: 1 은 이 레포에서 이미 병목이었다. #135 가 그 기록이다 —
    # "Dependabot 이 계산은 했지만 open-pull-requests-limit: 1 에 막혀 못 열었던
    # 3 건을 한 PR 에 담았다. 그대로 두면 월 1 건씩 3 개월이 걸린다." 결국 사람이
    # 배치로 처리했다.
    #
    # 감시 대상이 checkout·setup-node·upload-artifact·github-script 4 종이고,
    # 메이저가 같은 달에 겹쳐 나온 실적이 있다(2025-10: setup-node v6 + upload-artifact v5).
    # 최근 12 개월 이 4 종의 메이저 출시는 합계 9 건이다.
    #
    # ⚠️ 이 한도는 "열려 있는" PR 을 센다. 머지하지 않고 둔 PR 이 다음 달 슬롯을
    # 그대로 차지하므로, 2 여도 한 건을 방치하면 실질 슬롯은 1 이 된다. 액션마다
    # 슬롯을 보장하려면 4 로 올리면 된다 — 숫자 한 줄이다.
    open-pull-requests-limit: 2
