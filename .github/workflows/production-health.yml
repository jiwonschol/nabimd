name: Production health

on:
  schedule:
    # Avoid the top-of-hour congestion window for scheduled Actions.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit deployed to production
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  exercise-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Resolve the deployed revision
        id: revision
        continue-on-error: true
        env:
          DISPATCH_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            sha="${DISPATCH_SHA}"
          else
            sha="$(curl --fail --silent --show-error --location --head \
              https://onsoonlabs.com/nabimd/ \
              | tr -d '\r' \
              | awk 'tolower($1) == "x-nabi-build-sha:" { print $2 }' \
              | tail -n 1)"
          fi

          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a 40-character deployed commit." >&2
            exit 1
          fi

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise the deployed app
        id: smoke
        continue-on-error: true
        env:
          E2E_BASE_URL: https://onsoonlabs.com/nabimd/
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          if [[ "${{ steps.revision.outcome }}" != "success" ]]; then
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Production health attempt ${attempt} of 3"
            if npm run test:e2e:production; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 30
            fi
          done
          exit 1

      - name: Preserve failure evidence
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Open or update the production alert
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        with:
          script: |
            const revisionCheck = context.eventName === "workflow_dispatch";
            const title = revisionCheck
              ? "Production revision check is failing"
              : "Production health check is failing";
            const marker = revisionCheck
              ? "<!-- nabimd-production-revision -->"
              : "<!-- nabimd-production-health -->";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              marker,
              "The automated browser could not complete Nabi Markdown's production learning flow.",
              "",
              `- Event: \`${context.eventName}\``,
              revisionCheck
                ? `- Expected commit: \`${process.env.EXPECTED_SHA}\``
                : "- Mode: scheduled health",
              `- Evidence: ${runUrl}`,
              "",
              "The check uses authored problem-bank text only. It does not inspect or collect learner input.",
            ].join("\n");
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: "open", per_page: 100 },
            );
            const existing = issues.find(
              (issue) =>
                !issue.pull_request &&
                issue.user?.login === "github-actions[bot]" &&
                issue.title === title &&
                issue.body?.includes(marker),
            );
            if (existing) {
              const assignees = new Set(
                existing.assignees?.map(({ login }) => login) ?? [],
              );
              assignees.add(context.repo.owner);
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                assignees: [...assignees],
              });
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
            }

      - name: Close a recovered production alert
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const revisionCheck = context.eventName === "workflow_dispatch";
            const title = revisionCheck
              ? "Production revision check is failing"
              : "Production health check is failing";
            const marker = revisionCheck
              ? "<!-- nabimd-production-revision -->"
              : "<!-- nabimd-production-health -->";
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: "open", per_page: 100 },
            );
            const existing = issues.find(
              (issue) =>
                !issue.pull_request &&
                issue.user?.login === "github-actions[bot]" &&
                issue.title === title &&
                issue.body?.includes(marker),
            );
            if (existing) {
              const runUrl =
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: [
                  marker,
                  `Production completed the full browser check again: ${runUrl}`,
                ].join("\n"),
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Mark the workflow failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
