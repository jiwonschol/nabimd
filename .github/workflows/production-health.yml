name: Production health

on:
  push:
    branches:
      - main
  schedule:
    # Avoid the top-of-hour congestion window for scheduled Actions.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  # contents: checkout. issues: file and close the two reports.
  # statuses: read the commit's Vercel status, which is how the freshness
  # report names its cause. Unlisted permissions are disabled outright, so
  # dropping this one does not degrade the report — it makes the reporting
  # step throw before it classifies anything, and the rate-limit case goes
  # back to being a red check with no diagnosis. scripts/workflowPermissions
  # .test.mjs holds this file to what the reporting script actually calls.
  contents: read
  issues: write
  statuses: read

concurrency:
  group: production-health
  cancel-in-progress: true

env:
  # Not under test-results/: Playwright empties its output directory at the
  # start of every run, so a receipt written there would be deleted by the
  # next invocation before the report step could read it.
  DEPLOYED_SHA_RECEIPT: ${{ runner.temp }}/deployed-sha.txt

jobs:
  exercise-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Two questions, two checks, two reports. Collapsing them is what let a
      # rate-limited deployment read as "production is broken" ten times on
      # 2026-08-29 while the learning flow passed every single attempt.
      - name: Exercise the deployed app
        id: smoke
        continue-on-error: true
        env:
          E2E_BASE_URL: https://nabimd.vercel.app
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Waiting for the Vercel production deployment."
            sleep 45
          fi

          for attempt in 1 2 3; do
            echo "Production health attempt ${attempt} of 3"
            if npm run test:e2e:production; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 30
            fi
          done
          exit 1

      - name: Check production serves this commit
        id: freshness
        continue-on-error: true
        env:
          E2E_BASE_URL: https://nabimd.vercel.app
          # The commit that should be live. On a schedule run this is the tip
          # of the default branch, so a mismatch means deployments stopped.
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Deployment freshness attempt ${attempt} of 3"
            if npm run test:e2e:deployment; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 30
            fi
          done
          exit 1

      - name: Preserve failure evidence
        if: steps.smoke.outcome == 'failure' || steps.freshness.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Report on production
        id: report
        uses: actions/github-script@v9
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        with:
          script: |
            const { readFileSync } = require("node:fs")
            const { reportProductionHealth } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/reportProductionHealth.mjs`
            )

            const { failWorkflow, summary } = await reportProductionHealth({
              github,
              context,
              smokeOutcome: process.env.SMOKE_OUTCOME,
              freshnessOutcome: process.env.FRESHNESS_OUTCOME,
              readDeployedSha: () => {
                try {
                  return readFileSync(
                    process.env.DEPLOYED_SHA_RECEIPT,
                    "utf8",
                  ).trim()
                } catch {
                  // The page never answered. The classifier reads that as an
                  // unknown commit rather than guessing one.
                  return null
                }
              },
            })

            await core.summary.addRaw(summary).write()
            core.setOutput("fail-workflow", failWorkflow ? "true" : "false")

      - name: Mark the workflow failed
        if: steps.report.outputs.fail-workflow == 'true'
        run: exit 1
