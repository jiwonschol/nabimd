    <title>Nabi Markdown — 마크다운으로 문서 한 장 쓰기</title>
    <script>
      // 동의 전에는 Cloudflare가 끼워 넣은 beacon도 집계하지 않게 "이미 불렀다"
      // 표시를 미리 남긴다(허브 site/consent.js와 같은 방법, 계획서 §4.6).
      // 동의하면 src/consent/consent.ts가 이 표시를 지우고 beacon을 부른다.
      try {
        var stored = JSON.parse(localStorage.getItem("nabimd.consent.v1"))
        if (!(stored && stored.v === 1 && stored.analytics === true)) {
          window.__cfBeacon = { load: "single" }
        }
      } catch (error) {
        window.__cfBeacon = { load: "single" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
